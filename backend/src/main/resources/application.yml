spring:
  application:
    name: spade
  datasource:
    url: ${SPADE_DB_URL:jdbc:postgresql://localhost:5432/spade}
    username: ${SPADE_DB_USER:spade}
    password: ${SPADE_DB_PASSWORD:}
  jackson:
    deserialization:
      # 1000.9 points is a mistake, not 1000: refuse a fraction where a whole number is expected (Jackson 3 default: truncate)
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health

spade:
  invite-code-sha256: ${SPADE_INVITE_CODE_SHA256:}
  login:
    max-failures: 5
    max-failures-per-address: 20
    lockout: PT5M
